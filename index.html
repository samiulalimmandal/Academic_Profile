  <head>
    <meta charset="UTF-8" />

    <link rel="icon" href="./favicon.ico" />
    <title>Meridian Research Collective | Academic Portfolio &amp; Research Group</title>
    <meta
      name="description"
      content="Shared academic portfolio, researcher profiles, publications, research projects, and downloadable CVs for the Meridian Research Collective."
    />
    <meta property="og:title" content="Meridian Research Collective | Academic Portfolio &amp; Research Group" />

    />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('meridian-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF8F5] text-[#18181B] dark:bg-[#0B0F17] dark:text-[#F1F5F9] antialiased selection:bg-[#1E3A8A]/15 selection:text-[#1E3A8A] dark:selection:bg-[#60A5FA]/20 dark:selection:text-[#93C5FD]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
